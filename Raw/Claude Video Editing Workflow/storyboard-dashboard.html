<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Storyboard Dashboard — Claude Video Editing Workflow</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --card-border: #1f2937;
      --accent-blue: #38bdf8;
      --accent-green: #22c55e;
      --accent-yellow: #facc15;
      --accent-red: #ef4444;
    }
    body {
      background-color: #090d16;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #374151;
      border-radius: 3px;
    }
  </style>
</head>
<body class="p-4 md:p-8 custom-scroll antialiased min-h-screen">

  <!-- Header Banner -->
  <header class="max-w-7xl mx-auto mb-8 bg-[#111827] border border-[#1f2937] rounded-2xl p-6 shadow-xl">
    <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-6">
      <div>
        <div class="flex items-center gap-3 mb-2">
          <span class="px-2.5 py-0.5 text-xs font-bold uppercase tracking-wider bg-sky-500/10 text-sky-400 border border-sky-500/20 rounded-full">9:16 Vertical Video</span>
          <span class="px-2.5 py-0.5 text-xs font-bold uppercase tracking-wider bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-full">Brand Kit Compliant</span>
          <span class="px-2.5 py-0.5 text-xs font-mono text-gray-400 bg-gray-800/60 px-2 py-0.5 rounded">30 FPS · 1080x1920</span>
        </div>
        <h1 class="text-2xl md:text-3xl font-extrabold text-white tracking-tight flex items-center gap-2">
          <span>🎬</span> Claude Video Editing Workflow
        </h1>
        <p class="text-sm text-gray-400 mt-1">
          Beat-by-beat storyboard review · Review cuts, dynamic captions, B-roll layers & motion assets
        </p>
      </div>

      <!-- Quick Metrics -->
      <div class="flex flex-wrap items-center gap-4">
        <div class="bg-[#1e293b] border border-gray-700/60 rounded-xl px-4 py-2.5 text-center min-w-[100px]">
          <div class="text-xs uppercase text-gray-400 font-medium">Duration</div>
          <div class="text-xl font-bold text-white font-mono">57.5s</div>
        </div>
        <div class="bg-[#1e293b] border border-gray-700/60 rounded-xl px-4 py-2.5 text-center min-w-[100px]">
          <div class="text-xs uppercase text-gray-400 font-medium">Total Beats</div>
          <div class="text-xl font-bold text-sky-400 font-mono" id="total-beats-count">8</div>
        </div>
        <div class="bg-[#1e293b] border border-gray-700/60 rounded-xl px-4 py-2.5 text-center min-w-[120px]">
          <div class="text-xs uppercase text-gray-400 font-medium">Approval</div>
          <div class="text-xl font-bold text-emerald-400 font-mono" id="approval-metric">0 / 8</div>
        </div>
        <div class="flex flex-col gap-2">
          <button onclick="approveAll()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs rounded-lg transition shadow-md flex items-center gap-1.5 cursor-pointer">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
            Approve All
          </button>
          <button onclick="exportReview()" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 text-gray-200 font-semibold text-xs rounded-lg transition flex items-center gap-1.5 cursor-pointer">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
            Export JSON
          </button>
        </div>
      </div>
    </div>

    <!-- Progress Bar -->
    <div class="mt-6 pt-4 border-t border-gray-800">
      <div class="flex justify-between text-xs text-gray-400 mb-1.5 font-medium">
        <span>Timeline Review Progress</span>
        <span id="progress-percent">0% Approved</span>
      </div>
      <div class="w-full h-2.5 bg-gray-800 rounded-full overflow-hidden">
        <div id="progress-bar-fill" class="h-full bg-emerald-500 transition-all duration-300 w-0"></div>
      </div>
    </div>

    <!-- Filter Tabs -->
    <div class="flex items-center gap-2 mt-5">
      <button onclick="filterBeats('all')" id="filter-all" class="filter-btn px-3 py-1.5 text-xs font-semibold rounded-lg bg-sky-500 text-white cursor-pointer">All Beats (8)</button>
      <button onclick="filterBeats('approved')" id="filter-approved" class="filter-btn px-3 py-1.5 text-xs font-semibold rounded-lg bg-gray-800 text-gray-300 hover:bg-gray-700 cursor-pointer">Approved (<span id="count-approved">0</span>)</button>
      <button onclick="filterBeats('pending')" id="filter-pending" class="filter-btn px-3 py-1.5 text-xs font-semibold rounded-lg bg-gray-800 text-gray-300 hover:bg-gray-700 cursor-pointer">Pending (<span id="count-pending">8</span>)</button>
      <button onclick="filterBeats('rejected')" id="filter-rejected" class="filter-btn px-3 py-1.5 text-xs font-semibold rounded-lg bg-gray-800 text-gray-300 hover:bg-gray-700 cursor-pointer">Rejected (<span id="count-rejected">0</span>)</button>
    </div>
  </header>

  <!-- Storyboard Beat Cards Grid -->
  <main class="max-w-7xl mx-auto space-y-6" id="beats-container">
  </main>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-6 right-6 bg-gray-900 border border-gray-700 text-white px-4 py-3 rounded-xl shadow-2xl transition-opacity duration-300 opacity-0 pointer-events-none z-50 flex items-center gap-3">
    <span id="toast-icon">✅</span>
    <span id="toast-message" class="text-sm font-medium">Action updated</span>
  </div>

  <script>
    const beatsData = [
      {
        id: "beat-1",
        num: "01",
        title: "The Hook & Core Promise",
        timecode: "00:00.00 → 00:04.20",
        duration: "4.2s",
        status: "pending",
        dialogue: "I turned Claude into my full-time video editor, and it cuts my videos 10 times faster.",
        cutType: "Jump punch-in (1.1x zoom) on 'Claude'",
        captions: [
          { text: "I TURNED", highlight: false },
          { text: "CLAUDE", highlight: "sky" },
          { text: "INTO MY", highlight: false },
          { text: "FULL-TIME", highlight: false },
          { text: "VIDEO EDITOR", highlight: "yellow" }
        ],
        layout: "Split Screen (50/50)",
        brollDescription: "Claude Code CLI terminal session animating dynamic FFmpeg commands in real-time.",
        assetType: "CLI Terminal Mockup + Audio Sub-Bass Hit",
        lowerThird: "The AI Video Editing Stack 🎬",
        mockupBg: "#0f172a",
        feedback: ""
      },
      {
        id: "beat-2",
        num: "02",
        title: "Studio File System Architecture",
        timecode: "00:04.20 → 00:11.00",
        duration: "6.8s",
        status: "pending",
        dialogue: "It all starts with this structured studio folder: References, Brand Kit, Raw footage, and Exports.",
        cutType: "Smooth slide-in of folder hierarchy card from top",
        captions: [
          { text: "STRUCTURED", highlight: false },
          { text: "STUDIO FOLDER:", highlight: "emerald" },
          { text: "REFERENCES,", highlight: false },
          { text: "BRAND KIT,", highlight: false },
          { text: "RAW & EXPORTS", highlight: "sky" }
        ],
        layout: "Split Screen with Floating Tree Card",
        brollDescription: "Sleek dark macOS Finder mockup highlighting the 4 core studio directories with glowing accents.",
        assetType: "Finder Tree UI Mockup + Folder Icons",
        lowerThird: "Folder Architecture 📁",
        mockupBg: "#0a0a0c",
        feedback: ""
      },
      {
        id: "beat-3",
        num: "03",
        title: "Style Ingestion via FFmpeg",
        timecode: "00:11.00 → 00:18.00",
        duration: "7.0s",
        status: "pending",
        dialogue: "Instead of guessing my style, Claude uses FFmpeg to pull a frame every single second from my reference videos.",
        cutType: "Horizontal filmstrip sweep across top split",
        captions: [
          { text: "FFMPEG PULLS", highlight: "sky" },
          { text: "A FRAME", highlight: false },
          { text: "EVERY SINGLE", highlight: false },
          { text: "SECOND", highlight: "yellow" }
        ],
        layout: "Split Screen with Scrolling Filmstrip",
        brollDescription: "Dynamic filmstrip carousel showing extracted frames from the 5 reference videos (Apple, Smart TV, Security Bug).",
        assetType: "FFmpeg CLI badge + Filmstrip Carousel",
        lowerThird: "Automated Reference Analysis 🎞️",
        mockupBg: "#18181b",
        feedback: ""
      },
      {
        id: "beat-4",
        num: "04",
        title: "Brand Kit & Style Guide Synthesis",
        timecode: "00:18.00 → 00:25.50",
        duration: "7.5s",
        status: "pending",
        dialogue: "It analyzes font weights, split-screen ratios, caption pill colors, and writes a permanent brand kit.",
        cutType: "Cut to presenter, B-roll flips into color palette cards",
        captions: [
          { text: "ANALYZES FONTS,", highlight: false },
          { text: "RATIOS & PILLS,", highlight: false },
          { text: "WRITES PERMANENT", highlight: false },
          { text: "BRAND KIT", highlight: "emerald" }
        ],
        layout: "Split Screen with Brand Kit Card",
        brollDescription: "Visual swatch card with color hex codes (#000000, #38BDF8, #FACC15), Syne/Inter typography, and 9:16 layout specs.",
        assetType: "Brand Kit Markdown Card + Color Chips",
        lowerThird: "Permanent Design Rules 🎨",
        mockupBg: "#0f172a",
        feedback: ""
      },
      {
        id: "beat-5",
        num: "05",
        title: "Precision Jump Cuts with Whisper",
        timecode: "00:25.50 → 00:33.70",
        duration: "8.2s",
        status: "pending",
        dialogue: "Next, Whisper transcribes the A-roll with word-level timestamps, cutting every pause over 250 milliseconds automatically.",
        cutType: "Rapid cut on 'Whisper' with audio waveform snap sound",
        captions: [
          { text: "WHISPER TRANSCRIBES", highlight: "sky" },
          { text: "WORD TIMESTAMPS,", highlight: false },
          { text: "CUTS ALL PAUSES", highlight: "red" }
        ],
        layout: "Full Screen Waveform Takeover → Split Return",
        brollDescription: "Interactive audio waveform visualizer showing speech chunks in emerald green and cut silences in translucent red.",
        assetType: "Waveform Audio Visualizer + Whisper Log",
        lowerThird: "Automated Silence Removal ⚡",
        mockupBg: "#090d16",
        feedback: ""
      },
      {
        id: "beat-6",
        num: "06",
        title: "Programmatic Motion Graphics (Remotion & HyperFrames)",
        timecode: "00:33.70 → 00:42.70",
        duration: "9.0s",
        status: "pending",
        dialogue: "For B-roll and titles, it doesn't drag clips manually—it writes code in Remotion and HyperFrames and renders deterministic 4K frames.",
        cutType: "Dual code/preview split animation",
        captions: [
          { text: "WRITES CODE IN", highlight: false },
          { text: "REMOTION", highlight: "sky" },
          { text: "&", highlight: false },
          { text: "HYPERFRAMES", highlight: "yellow" }
        ],
        layout: "Split Screen with Code Editor & Live Canvas",
        brollDescription: "Side-by-side IDE showing React/HTML animation code compiling directly into MP4 frames via headless browser.",
        assetType: "Remotion TSX + HyperFrames GSAP Player",
        lowerThird: "Code-Driven Motion Graphics 💻",
        mockupBg: "#111827",
        feedback: ""
      },
      {
        id: "beat-7",
        num: "07",
        title: "Storyboard Review & Approval Dashboard",
        timecode: "00:42.70 → 00:51.50",
        duration: "8.8s",
        status: "pending",
        dialogue: "Before rendering the final video, it generates an interactive storyboard dashboard where I can approve, reject, or leave feedback on every single beat.",
        cutType: "Presenter gestures upward towards the review card",
        captions: [
          { text: "INTERACTIVE", highlight: false },
          { text: "STORYBOARD:", highlight: "emerald" },
          { text: "APPROVE, REJECT,", highlight: false },
          { text: "OR FEEDBACK", highlight: "yellow" }
        ],
        layout: "Split Screen showing this exact Dashboard",
        brollDescription: "Screen capture of the Storyboard Dashboard UI with interactive toggles, timecodes, and feedback drawers.",
        assetType: "Interactive Web Component Mockup",
        lowerThird: "Client Review Dashboard 📋",
        mockupBg: "#0a0a0c",
        feedback: ""
      },
      {
        id: "beat-8",
        num: "08",
        title: "Outro & Final Export Pipeline",
        timecode: "00:51.50 → 00:57.50",
        duration: "6.0s",
        status: "pending",
        dialogue: "That is how you edit high-retention videos with Claude. Drop your footage in the folder, and let the agent work.",
        cutType: "Final punch-out cut to master logo and pulsed CTA",
        captions: [
          { text: "DROP YOUR FOOTAGE,", highlight: false },
          { text: "LET CLAUDE EDIT", highlight: "yellow" }
        ],
        layout: "Split Screen to Final Export Card",
        brollDescription: "Final exported video file 'Exports/Claude-Workflow.mp4' popping with glowing checkmark badge and file size indicator.",
        assetType: "Export Delivery Card + CTA Banner",
        lowerThird: "Start Editing with Claude 🚀",
        mockupBg: "#0f172a",
        feedback: ""
      }
    ];

    let currentFilter = 'all';

    function init() {
      const saved = localStorage.getItem('claude_video_storyboard_state');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          beatsData.forEach(beat => {
            if (parsed[beat.id]) {
              beat.status = parsed[beat.id].status || beat.status;
              beat.feedback = parsed[beat.id].feedback || beat.feedback;
            }
          });
        } catch (e) {
          console.error('Error loading saved storyboard state', e);
        }
      }
      renderBeats();
      updateMetrics();
    }

    function saveState() {
      const state = {};
      beatsData.forEach(b => {
        state[b.id] = { status: b.status, feedback: b.feedback };
      });
      localStorage.setItem('claude_video_storyboard_state', JSON.stringify(state));
    }

    function renderBeats() {
      const container = document.getElementById('beats-container');
      container.innerHTML = '';

      const filtered = beatsData.filter(b => {
        if (currentFilter === 'all') return true;
        return b.status === currentFilter;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="bg-[#111827] border border-[#1f2937] rounded-2xl p-12 text-center text-gray-400">
            <p class="text-lg font-medium">No beats matching filter "${currentFilter}".</p>
          </div>
        `;
        return;
      }

      filtered.forEach(beat => {
        const card = document.createElement('article');
        card.className = `bg-[#111827] border rounded-2xl p-6 transition-all duration-200 shadow-lg ${
          beat.status === 'approved' ? 'border-emerald-500/40 bg-emerald-950/10' :
          beat.status === 'rejected' ? 'border-red-500/40 bg-red-950/10' :
          'border-[#1f2937]'
        }`;
        card.id = `card-${beat.id}`;

        const statusBadge = 
          beat.status === 'approved' ? '<span class="px-2.5 py-1 text-xs font-bold uppercase rounded-md bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center gap-1">✓ Approved</span>' :
          beat.status === 'rejected' ? '<span class="px-2.5 py-1 text-xs font-bold uppercase rounded-md bg-red-500/20 text-red-400 border border-red-500/30 flex items-center gap-1">✕ Rejected</span>' :
          '<span class="px-2.5 py-1 text-xs font-bold uppercase rounded-md bg-amber-500/20 text-amber-400 border border-amber-500/30 flex items-center gap-1">⏳ Pending Review</span>';

        const captionPill = beat.captions.map(c => {
          let colorClass = "text-white";
          if (c.highlight === "yellow") colorClass = "text-yellow-300 font-extrabold";
          if (c.highlight === "sky") colorClass = "text-sky-300 font-extrabold";
          if (c.highlight === "emerald") colorClass = "text-emerald-300 font-extrabold";
          if (c.highlight === "red") colorClass = "text-red-400 font-extrabold";
          return `<span class="${colorClass}">${c.text}</span>`;
        }).join(" ");

        card.innerHTML = `
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div class="lg:col-span-4 flex flex-col items-center">
              <div class="w-full max-w-[240px] aspect-[9/16] bg-black rounded-2xl border-2 border-gray-700/80 shadow-2xl relative overflow-hidden flex flex-col">
                <div class="h-1/2 w-full p-2.5 flex flex-col justify-between" style="background-color: ${beat.mockupBg}">
                  <div class="flex items-center justify-between text-[11px] text-gray-400 font-mono">
                    <span class="flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-red-400"></span><span class="w-1.5 h-1.5 rounded-full bg-yellow-400"></span><span class="w-1.5 h-1.5 rounded-full bg-green-400"></span></span>
                    <span class="truncate max-w-[120px] text-gray-300">${beat.assetType}</span>
                  </div>
                  <div class="p-2 bg-black/40 rounded border border-white/10 text-center">
                    <p class="text-[11px] text-gray-300 leading-tight">${beat.brollDescription}</p>
                  </div>
                  <div class="text-[10px] text-sky-400 font-mono uppercase text-right">TOP LAYER</div>
                </div>

                <div class="w-full py-1 bg-black flex justify-center z-10 -my-2.5">
                  <div class="px-2.5 py-1 bg-black/90 border border-gray-700 rounded-md text-[11px] tracking-wide text-center leading-tight shadow-lg">
                    ${captionPill}
                  </div>
                </div>

                <div class="h-1/2 w-full bg-gradient-to-t from-gray-900 to-gray-800 p-2.5 flex flex-col justify-between relative">
                  <div class="w-12 h-12 rounded-full bg-gray-700/80 border border-gray-500 mx-auto mt-2 flex items-center justify-center text-xs text-gray-300">
                    A-Roll
                  </div>
                  <div class="bg-black/90 border border-gray-700 rounded-full px-2 py-0.5 text-[10px] text-center text-gray-200 font-medium truncate mb-1">
                    ${beat.lowerThird}
                  </div>
                </div>
              </div>
              <div class="mt-2 text-xs text-gray-400 font-mono">${beat.layout}</div>
            </div>

            <div class="lg:col-span-8 flex flex-col justify-between">
              <div>
                <div class="flex flex-wrap items-center justify-between gap-3 pb-3 border-b border-gray-800">
                  <div class="flex items-center gap-3">
                    <span class="text-lg font-black font-mono text-sky-400">#${beat.num}</span>
                    <h2 class="text-lg font-bold text-white">${beat.title}</h2>
                  </div>
                  <div class="flex items-center gap-2">
                    <span class="font-mono text-xs text-gray-300 bg-gray-800 px-2.5 py-1 rounded-md border border-gray-700">${beat.timecode} (${beat.duration})</span>
                    <div id="status-badge-${beat.id}">${statusBadge}</div>
                  </div>
                </div>

                <div class="mt-4 space-y-3">
                  <div>
                    <label class="text-xs uppercase tracking-wider text-gray-400 font-semibold block mb-1">🎙️ Spoken Dialogue (A-Roll)</label>
                    <div class="p-3 bg-gray-900/90 rounded-xl border border-gray-800 text-sm text-gray-100 font-medium leading-relaxed">
                      "${beat.dialogue}"
                    </div>
                  </div>

                  <div class="flex flex-wrap items-center gap-2 text-xs">
                    <span class="text-gray-400 font-medium">✂️ Cut Direction:</span>
                    <span class="px-2 py-0.5 rounded bg-gray-800 text-amber-300 font-mono border border-gray-700">${beat.cutType}</span>
                  </div>

                  <div>
                    <label class="text-xs uppercase tracking-wider text-gray-400 font-semibold block mb-1">💬 On-Screen Subtitle Pill</label>
                    <div class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-black/80 border border-gray-700 rounded-lg text-xs font-bold tracking-wide shadow-inner">
                      ${captionPill}
                    </div>
                  </div>

                  <div>
                    <label class="text-xs uppercase tracking-wider text-gray-400 font-semibold block mb-1">🖼️ B-Roll & Layer Assets</label>
                    <div class="p-2.5 bg-gray-900/60 rounded-xl border border-gray-800/80 text-xs text-gray-300 space-y-1">
                      <div class="flex items-center gap-2">
                        <span class="text-sky-400 font-bold">Visual:</span>
                        <span>${beat.brollDescription}</span>
                      </div>
                      <div class="flex items-center gap-2">
                        <span class="text-emerald-400 font-bold">Lower Third:</span>
                        <span>${beat.lowerThird}</span>
                      </div>
                    </div>
                  </div>

                  <div class="mt-3">
                    <div class="flex justify-between items-center mb-1">
                      <label class="text-xs uppercase tracking-wider text-gray-400 font-semibold">📝 Director Feedback / Revision Notes</label>
                      <button onclick="toggleFeedbackBox('${beat.id}')" class="text-xs text-sky-400 hover:underline cursor-pointer">
                        ${beat.feedback ? 'Edit Note' : '+ Add Note'}
                      </button>
                    </div>
                    <div id="feedback-drawer-${beat.id}" class="${beat.feedback ? '' : 'hidden'}">
                      <textarea 
                        id="feedback-input-${beat.id}"
                        rows="2" 
                        placeholder="Add notes for this cut (e.g. adjust zoom timing, swap asset, highlight different word)..."
                        class="w-full bg-gray-950 border border-gray-800 rounded-xl p-2.5 text-xs text-gray-200 focus:outline-none focus:border-sky-500 font-sans"
                        onblur="saveFeedback('${beat.id}')"
                      >${beat.feedback}</textarea>
                    </div>
                  </div>
                </div>
              </div>

              <div class="mt-5 pt-3 border-t border-gray-800 flex items-center justify-end gap-3">
                <button 
                  onclick="setStatus('${beat.id}', 'rejected')"
                  class="px-4 py-1.5 rounded-lg text-xs font-semibold text-red-400 bg-red-500/10 hover:bg-red-500/20 border border-red-500/20 transition flex items-center gap-1.5 cursor-pointer"
                >
                  ✕ Reject Cut
                </button>
                <button 
                  onclick="setStatus('${beat.id}', 'approved')"
                  class="px-5 py-1.5 rounded-lg text-xs font-bold text-emerald-300 bg-emerald-600 hover:bg-emerald-500 transition shadow-md flex items-center gap-1.5 cursor-pointer"
                >
                  ✓ Approve Beat
                </button>
              </div>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function setStatus(beatId, newStatus) {
      const beat = beatsData.find(b => b.id === beatId);
      if (!beat) return;
      beat.status = newStatus;
      saveState();
      renderBeats();
      updateMetrics();
      showToast(newStatus === 'approved' ? `Beat #${beat.num} Approved` : `Beat #${beat.num} Rejected`, newStatus === 'approved' ? '✅' : '⚠️');
    }

    function approveAll() {
      beatsData.forEach(b => b.status = 'approved');
      saveState();
      renderBeats();
      updateMetrics();
      showToast('All 8 beats approved!', '🎉');
    }

    function toggleFeedbackBox(beatId) {
      const drawer = document.getElementById(`feedback-drawer-${beatId}`);
      if (drawer) {
        drawer.classList.toggle('hidden');
        if (!drawer.classList.contains('hidden')) {
          const input = document.getElementById(`feedback-input-${beatId}`);
          if (input) input.focus();
        }
      }
    }

    function saveFeedback(beatId) {
      const input = document.getElementById(`feedback-input-${beatId}`);
      const beat = beatsData.find(b => b.id === beatId);
      if (input && beat) {
        beat.feedback = input.value.trim();
        saveState();
        if (beat.feedback) {
          showToast(`Feedback saved for Beat #${beat.num}`, '💾');
        }
      }
    }

    function filterBeats(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('bg-sky-500', 'text-white');
        btn.classList.add('bg-gray-800', 'text-gray-300');
      });
      const activeBtn = document.getElementById(`filter-${filter}`);
      if (activeBtn) {
        activeBtn.classList.remove('bg-gray-800', 'text-gray-300');
        activeBtn.classList.add('bg-sky-500', 'text-white');
      }
      renderBeats();
    }

    function updateMetrics() {
      const total = beatsData.length;
      const approved = beatsData.filter(b => b.status === 'approved').length;
      const rejected = beatsData.filter(b => b.status === 'rejected').length;
      const pending = beatsData.filter(b => b.status === 'pending').length;

      document.getElementById('total-beats-count').innerText = total;
      document.getElementById('approval-metric').innerText = `${approved} / ${total}`;
      document.getElementById('count-approved').innerText = approved;
      document.getElementById('count-pending').innerText = pending;
      document.getElementById('count-rejected').innerText = rejected;

      const pct = Math.round((approved / total) * 100);
      document.getElementById('progress-percent').innerText = `${pct}% Approved`;
      document.getElementById('progress-bar-fill').style.width = `${pct}%`;
    }

    function exportReview() {
      const payload = {
        project: "Claude Video Editing Workflow",
        exportTimestamp: new Date().toISOString(),
        totalBeats: beatsData.length,
        approvedBeats: beatsData.filter(b => b.status === 'approved').length,
        beats: beatsData.map(b => ({
          beat: b.num,
          title: b.title,
          timecode: b.timecode,
          duration: b.duration,
          status: b.status,
          cutType: b.cutType,
          dialogue: b.dialogue,
          captions: b.captions.map(c => c.text).join(" "),
          broll: b.brollDescription,
          lowerThird: b.lowerThird,
          feedback: b.feedback
        }))
      };

      const jsonStr = JSON.stringify(payload, null, 2);
      navigator.clipboard.writeText(jsonStr).then(() => {
        showToast('Review JSON copied to clipboard!', '📋');
      }).catch(() => {
        const blob = new Blob([jsonStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'claude-video-storyboard-review.json';
        a.click();
        showToast('Review JSON downloaded!', '💾');
      });
    }

    function showToast(message, icon = '✅') {
      const toast = document.getElementById('toast');
      document.getElementById('toast-message').innerText = message;
      document.getElementById('toast-icon').innerText = icon;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2500);
    }

    init();
  </script>
</body>
</html>
